name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: CLI smoke test
        run: |
          python -m terminal_snap --help
          python -m terminal_snap --version
          python -m terminal_snap validate examples/ansi.yaml
          python -m terminal_snap themes
          python -m terminal_snap fonts
          python -m terminal_snap render examples/pytest.yaml --out /tmp/pytest.png --json
          python -m terminal_snap gallery examples --out /tmp/gallery
          test -s /tmp/pytest.png
      - name: Determinism check
        run: |
          python -m terminal_snap render examples/ansi.yaml --out /tmp/a.png
          python -m terminal_snap render examples/ansi.yaml --out /tmp/b.png
          cmp /tmp/a.png /tmp/b.png
