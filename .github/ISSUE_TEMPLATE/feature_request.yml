name: Feature request
description: Suggest a new scene field, output format, theme or command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not the implementation.
      placeholder: I want the same scene rendered for light and dark docs pages.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would the ideal interface look like?
      render: yaml
      placeholder: |
        theme: github-dark
        theme_light: solarized-light
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, or using another tool.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be implemented with no new runtime dependencies.
        - label: I am willing to open a pull request.
